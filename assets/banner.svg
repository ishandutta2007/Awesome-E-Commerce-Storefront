<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.1)"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(8deg); }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1000px 300px; }
    .particle { animation: floatParticle 6s ease-in-out infinite; }
    .stream { stroke-dasharray: 8 16; animation: waveFlow 4s linear infinite; }
    .pulsing-node { animation: nodeBlink 3s ease-in-out infinite alternate; transform-origin: center; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Dynamic Glowing Ambient Orbs (Kept behind) -->
  <g filter="url(#glow)">
    <circle class="orb-1" cx="220" cy="120" r="140" fill="#6366f1"/>
    <circle class="orb-2" cx="980" cy="280" r="160" fill="#06b6d4"/>
    <circle class="orb-1" cx="600" cy="380" r="120" fill="#ec4899" opacity="0.2"/>
  </g>

  <!-- Dynamic Data Stream Wave Lines -->
  <g opacity="0.4">
    <path class="stream" d="M -50 320 C 300 240, 450 380, 800 290 C 1000 240, 1150 310, 1250 280" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="stream" d="M -50 120 C 250 180, 500 60, 750 150 C 950 220, 1100 120, 1250 160" fill="none" stroke="#c084fc" stroke-width="1.5" style="animation-duration: 6s;"/>
  </g>

  <!-- Animated Floating E-Commerce Metric Badges (Flanking sides, low opacity) -->
  <g class="particle" opacity="0.75">
    <!-- Left badge: Cart / Checkout -->
    <rect x="70" y="80" width="130" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="89" cy="99" r="6" fill="#38bdf8" class="pulsing-node"/>
    <text x="105" y="104" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Fast Checkout</text>

    <!-- Left lower badge: Headless API -->
    <rect x="110" y="270" width="135" height="38" rx="19" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="129" cy="289" r="6" fill="#818cf8" class="pulsing-node"/>
    <text x="145" y="294" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔌 GraphQL &amp; REST</text>
  </g>

  <g class="particle" opacity="0.75" style="animation-delay: -3s;">
    <!-- Right badge: Self-Hosted -->
    <rect x="990" y="90" width="140" height="38" rx="19" fill="#1e293b" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="1009" cy="109" r="6" fill="#ec4899" class="pulsing-node"/>
    <text x="1025" y="114" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ 0% Platform Fees</text>

    <!-- Right lower badge: Global Scale -->
    <rect x="950" y="260" width="140" height="38" rx="19" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="969" cy="279" r="6" fill="#10b981" class="pulsing-node"/>
    <text x="985" y="284" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 Omnichannel</text>
  </g>

  <!-- FOREGROUND: Crystal Clear Title & Subtitles (Protected Layer) -->
  <g text-anchor="middle">
    <!-- Category Pill -->
    <g transform="translate(600, 95)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="1.5"/>
      <text y="5" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="195" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome E-Commerce Storefront
    </text>

    <!-- Subtitle -->
    <text x="600" y="245" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.2">
      SaaS Platforms &amp; Open-Source Storefront Solutions
    </text>

    <!-- Tagline -->
    <text x="600" y="285" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" letter-spacing="0.4">
      Headless Commerce • Self-Hosted Frameworks • Zero Platform Fees • Omnichannel Architecture
    </text>

    <!-- Tech Stack Mini Badges -->
    <g transform="translate(600, 335)">
      <text fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        TypeScript • PHP • Python/Django • Ruby on Rails • Node.js • Go • GraphQL • REST
      </text>
    </g>
  </g>
</svg>
